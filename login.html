<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/status.css">
   
</head>

<body>
    <!-- Indicador de status da conexão no canto superior esquerdo -->
    <div id="status-conexao" class="status-conexao desconectado" aria-live="polite">
        <span id="status-icone" class="status-icone" aria-hidden="true"></span>
        <span id="status-texto">Desconectado</span>
    </div>

    <div class="app-container">

        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main class="login-container">

            <h2>Acesso ao Sistema</h2>
            <p>Informe seu login e senha para continuar.</p>

            <!-- Formulário de Login -->
            <form id="form-login" class="login-form">

                <!-- Campo de Login -->
                <div class="input-group">
                    <label for="login">Login</label>
                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Digite seu login"
                        required
                    >
                </div>

                <!-- Campo de Senha -->
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <!-- Botão principal -->
                <button type="submit" id="btn-entrar" class="btn-primary">
                    Entrar
                </button>

                <!-- Botão secundário de cadastro -->
                <button type="button" id="btn-cadastro" class="btn-outline">
                    Ainda não tenho cadastro
                </button>

            </form>

            <!-- Mensagem de retorno -->
            <p id="mensagem" class="mensagem" aria-live="polite"></p>

        </main>

        <footer>
            <p>&copy; 2026 Estoque Fácil</p>
        </footer>

    </div>

    <!-- 1. SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Conexão com o projeto do Supabase -->
    <script src="js/conectar.js"></script>

    <!-- 3. Lógica da tela de login -->
    <script src="js/login.js"></script>

</body>
</html>
