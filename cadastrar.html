<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="app-container">

        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main class="login-container">

            <h2>Cadastro de Usuário</h2>
            <p>Preencha os dados abaixo para criar sua conta.</p>

            <!-- Formulário de Cadastro -->
            <form id="form-cadastro" class="login-form">

                <!-- Nome -->
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <!-- CPF -->
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        required
                    >
                </div>

                <!-- Fone -->
                <div class="input-group">
                    <label for="fone">Telefone</label>
                    <input
                        type="tel"
                        id="fone"
                        name="fone"
                        placeholder="Digite seu telefone"
                        required
                    >
                </div>

                <!-- Endereço (digitado manualmente, sem API) -->
                <div class="input-group">
                    <label for="endereco">Endereço</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua / Avenida"
                        required
                    >
                </div>

                <!-- Bairro -->
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input
                        type="text"
                        id="bairro"
                        name="bairro"
                        placeholder="Digite o bairro"
                        required
                    >
                </div>

                <!-- Número -->
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input
                        type="text"
                        id="numero"
                        name="numero"
                        placeholder="Número ou S/N"
                        required
                    >
                </div>

                <!-- E-mail -->
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <!-- Login -->
                <div class="input-group">
                    <label for="login">Login</label>
                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Escolha um login"
                        required
                    >
                </div>

                <!-- Senha -->
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <!-- Botão principal -->
                <button type="submit" id="btn-cadastrar" class="btn-primary">
                    Cadastrar
                </button>

                <!-- Voltar para o login -->
                <button type="button" id="btn-voltar-login" class="btn-outline">
                    Já tenho cadastro
                </button>

            </form>

            <!-- Mensagem de retorno -->
            <p id="mensagem" class="mensagem" aria-live="polite"></p>

        </main>

        <footer>
            <p>&copy; 2026 Estoque Fácil</p>
        </footer>

    </div>

    <!-- 1. SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Conexão com o projeto do Supabase -->
    <script src="js/conectar.js"></script>

    <!-- 3. Lógica de inserção na tabela 'usuario' -->
    <script>
        const formCadastro = document.getElementById('form-cadastro');
        const btnCadastrar = document.getElementById('btn-cadastrar');
        const btnVoltarLogin = document.getElementById('btn-voltar-login');
        const mensagem = document.getElementById('mensagem');

        formCadastro.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Coleta e limpa os valores dos campos
            const novoUsuario = {
                nome: document.getElementById('nome').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                fone: document.getElementById('fone').value.trim(),
                endereco: document.getElementById('endereco').value.trim(),
                bairro: document.getElementById('bairro').value.trim(),
                numero: document.getElementById('numero').value.trim(),
                email: document.getElementById('email').value.trim().toLowerCase(),
                login: document.getElementById('login').value.trim(),
                senha: document.getElementById('senha').value
            };

            btnCadastrar.disabled = true;
            btnCadastrar.textContent = 'Cadastrando...';
            mensagem.textContent = '';

            try {
                // Insere na tabela 'usuario' (id, created_at e perfil são gerados/definidos automaticamente)
                const { data, error } = await _supabase
                    .from('usuario')
                    .insert([novoUsuario])
                    .select();

                if (error) {
                    console.error('Erro ao cadastrar:', error.message);

                    // Tratamento amigável caso login, email ou cpf sejam únicos
                    if (error.code === '23505') {
                        mensagem.textContent = 'Já existe um usuário com este login, e-mail ou CPF.';
                    } else {
                        mensagem.textContent = 'Erro ao salvar cadastro: ' + error.message;
                    }
                    mensagem.style.color = '#b91c1c';
                    return;
                }

                mensagem.textContent = 'Cadastro realizado com sucesso! Redirecionando para o login...';
                mensagem.style.color = '#15803d';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);

            } catch (err) {
                console.error('Erro inesperado:', err);
                mensagem.textContent = 'Ocorreu um erro inesperado ao cadastrar.';
                mensagem.style.color = '#b91c1c';
            } finally {
                btnCadastrar.disabled = false;
                btnCadastrar.textContent = 'Cadastrar';
            }
        });

        btnVoltarLogin.addEventListener('click', () => {
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
