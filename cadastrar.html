
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque Fácil - Cadastrar Produto</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

    <div class="app-container">

        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main>

            <section>
                <h2>Cadastrar produto</h2>
                <p>Adicionar um novo produto.</p>
            </section>

            <section>

                <form id="form-produto">

                    <div style="margin-bottom: 15px;">
                        <label for="produto">Nome do produto:</label><br>

                        <input
                            type="text"
                            id="produto"
                            placeholder="Digite o nome"
                            required
                            style="padding: 8px; width: 100%; margin-top: 5px; box-sizing: border-box;"
                        >
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label for="quantidade">Quantidade:</label><br>

                        <input
                            type="number"
                            id="quantidade"
                            placeholder="Digite a quantidade"
                            min="0"
                            step="1"
                            required
                            style="padding: 8px; width: 100%; margin-top: 5px; box-sizing: border-box;"
                        >
                    </div>

                    <div>
                        <button
                            type="submit"
                            id="btn-salvar"
                            style="padding: 10px 15px; background-color: #1e1e1e; color: #fff; border: none; border-radius: 4px; cursor: pointer;"
                        >
                            Salvar produto
                        </button>
                    </div>

                    <p id="mensagem" role="status" aria-live="polite"></p>

                </form>

            </section>

        </main>

        <footer>
            <a href="index.html">← Voltar para o menu principal</a>
        </footer>

    </div>

    <!-- 1. SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Arquivo de conexão -->
    <script src="js/conectar.js"></script>

    <!-- 3. Verificação de autenticação e cadastro -->
    <script>

        async function verificarAutenticacao() {

            const { data: { session }, error } =
                await _supabase.auth.getSession();

            if (error || !session) {
                window.location.href = 'login.html';
                return false;
            }

            return true;
        }

        // Verifica a autenticação antes de permitir o cadastro
        verificarAutenticacao();

        // Captura os elementos do formulário
        const formProduto = document.getElementById('form-produto');
        const mensagem = document.getElementById('mensagem');
        const btnSalvar = document.getElementById('btn-salvar');

        // Evento de envio do formulário
        formProduto.addEventListener('submit', async (event) => {

            event.preventDefault();

            mensagem.textContent = '';

            try {

                // Verifica se o usuário está autenticado
                const autenticado = await verificarAutenticacao();

                if (!autenticado) {
                    return;
                }

                // Captura os valores dos campos
                const produto = document.getElementById('produto').value.trim();

                const quantidade = Number(
                    document.getElementById('quantidade').value
                );

                // Validação dos dados
                if (produto === '') {
                    mensagem.textContent = 'Informe o nome do produto.';
                    return;
                }

                if (!Number.isSafeInteger(quantidade) || quantidade < 0) {
                    mensagem.textContent = 'Informe uma quantidade válida.';
                    return;
                }

                // Desabilita o botão durante o cadastro
                btnSalvar.disabled = true;
                btnSalvar.textContent = 'Salvando...';

                // Envia os dados para a tabela produtos
                const { error } = await _supabase
                    .from('produtos')
                    .insert([
                        {
                            produto: produto,
                            quantidade: quantidade
                        }
                    ]);

                if (error) {
                    console.error('Erro ao cadastrar produto:', error);

                    mensagem.textContent =
                        'Erro ao cadastrar produto. Verifique os dados e tente novamente.';

                    return;
                }

                // Mensagem de sucesso
                mensagem.textContent = 'Produto cadastrado com sucesso!';

                // Limpa os campos
                formProduto.reset();

            } catch (erro) {

                console.error('Erro inesperado:', erro);

                mensagem.textContent =
                    'Ocorreu um erro ao conectar com o banco de dados.';

            } finally {

                // Reativa o botão
                btnSalvar.disabled = false;
                btnSalvar.textContent = 'Salvar produto';

            }

        });

    </script>

</body>
</html>
